<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <meta name="description" content="The page you're looking for could not be found.">
  <title>404 — Page Not Found</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N4NGTP8WXB"></script>  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-N4NGTP8WXB');
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --background: #ffffff;
      --foreground: #17191d;
      --muted: #737b86;
      --accent: #2a8de0;
      --border: #e5e8ec;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      font-family: 'Inter', sans-serif;
      line-height: 1.8;
      display: flex;
      flex-direction: column;
    }
    
    a {
      color: inherit;
      text-decoration: none;
    }
    
    main {
      width: min(100% - 48px, 760px);
      margin: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    /* HEADER */
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 0 22px;
      border-bottom: 1px solid var(--border);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.4px;
    }
    
    .brand {
      font-weight: 500;
    }
    
    .status {
      color: var(--muted);
    }
    
    /* ERROR */
    
    .error {
      flex: 1;
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 70px 0;
    }
    
    .eyebrow {
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
    }
    
    .error-code {
      font-size: clamp(100px, 22vw, 180px);
      font-weight: 600;
      letter-spacing: -12px;
      line-height: .95;
    }
    
    .error-title {
      font-size: clamp(25px, 5vw, 36px);
      font-weight: 500;
      letter-spacing: -1.5px;
      margin-top: 30px;
    }
    
    .error-description {
      max-width: 430px;
      color: var(--muted);
      font-size: 13px;
      line-height: 2;
      margin-top: 15px;
    }
    
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }
    
    .button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 11px;
      transition: .2s;
    }
    
    .button span {
      color: var(--accent);
    }
    
    .button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    /* FOOTER */
    
    footer {
      width: min(100% - 48px, 760px);
      margin: auto;
      padding: 22px 0 30px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #858d97;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: .5px;
    }
    
    /* RESPONSIVE */
    
    @media(max-width: 560px) {
      header {
        padding-top: 24px;
      }
      
      .error {
        min-height: 60vh;
      }
      
      .error-code {
        letter-spacing: -7px;
      }
      
      footer {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  
  <main>
    
    <header>
      <a href="index.html" class="brand">RICKCLMNT</a>
      <span class="status">404 / NOT FOUND</span>
    </header>
    
    <section class="error">
      
      <p class="eyebrow">ERROR</p>
      
      <h1 class="error-code">404</h1>
      
      <h2 class="error-title">Page not found.</h2>
      
      <p class="error-description">
        The page you're looking for doesn't exist,
        may have been moved, or is no longer available.
      </p>
      
      <div class="actions">
        <a href="index.html" class="button">
          Return home <span>↗</span>
        </a>
      </div>
      
    </section>
    
  </main>
  
  <footer>
    <span>© 2026 RICKCLMNT</span>
  </footer>
  
</body>

</html>
